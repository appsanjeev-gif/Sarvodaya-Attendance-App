name: Build Sarvodaya Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Verify Pure 192-D MobileFaceNet TFLite Model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 "https://raw.githubusercontent.com/MCarlomagno/FaceRecognitionAuth/master/assets/mobilefacenet.tflite" -o app/src/main/assets/mobile_face_net.tflite || \
          curl -fL --retry 3 "https://github.com/MCarlomagno/FaceRecognitionAuth/raw/master/assets/mobilefacenet.tflite" -o app/src/main/assets/mobile_face_net.tflite || \
          curl -fL --retry 3 "https://raw.githubusercontent.com/Youcef-Goudjal/face-recognition-flutter/TFLite/assets/mobile_face_net.tflite" -o app/src/main/assets/mobile_face_net.tflite || \
          curl -fL --retry 3 "https://github.com/Youcef-Goudjal/face-recognition-flutter/raw/TFLite/assets/mobile_face_net.tflite" -o app/src/main/assets/mobile_face_net.tflite
          ls -lh app/src/main/assets/mobile_face_net.tflite
          FILE_SIZE=$(stat -c%s "app/src/main/assets/mobile_face_net.tflite" || echo 0)
          echo "Downloaded 192-D Model Size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 4000000 ]; then
            echo "Error: Downloaded TFLite model is not the valid 5MB 192-D MobileFaceNet ($FILE_SIZE bytes)"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarvodaya-Attendance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
