name: Build Sarvodaya Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download MobileFaceNet 192-Point TFLite AI Model
        run: |
          mkdir -p app/src/main/assets
          curl -fL "https://raw.githubusercontent.com/MCarlomagno/FaceRecognitionAuth/master/assets/mobilefacenet.tflite" -o app/src/main/assets/mobile_face_net.tflite || \
          curl -fL "https://github.com/sirius-ai/MobileFaceNet_TF/raw/master/arch/pretrained_model/mobilefacenet.tflite" -o app/src/main/assets/mobile_face_net.tflite
          ls -lh app/src/main/assets/mobile_face_net.tflite

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarvodaya-Attendance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
